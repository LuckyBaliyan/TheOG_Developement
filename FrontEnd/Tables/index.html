<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        *{
            padding:0;
            margin:0;
            box-sizing: border-box;
        }
        body{
            width:100%;
            height:100vh;
            overflow: hidden;
            font-family: "Neue Montreal",sans-serif;
        }
        main{
            width: 100%;
            height:100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        table{
            width:50%;
            height:50%;
            border:0.5px solid rgba(0, 0, 0, 0.5);
        }

        table th{
            font-size: 2.3rem;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.2em;
        }

        table td{
            padding: 2px;
            text-align: center;
        }

        table td:first-child{
            text-align: start;
        }

        table tr{
            background-color: rgba(251, 251, 252, 0.595);
        }

        table tr:nth-child(even){
            background-color: rgba(233, 190, 236, 0.54);
            border: 30px solid black;
        }
    </style>
</head>
