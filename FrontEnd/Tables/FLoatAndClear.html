<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 100px;
  height: 100px;
  color: white;
  text-align: center;
  line-height: 100px;
  margin: 10px;
}

.left {
  background: tomato;
  float: left;
}

.right {
  background: teal;
  float: right;
}

.clear {
  clear: both;
  background: gray;
  height: 50px;
  text-align: center;
  line-height: 1.2;
}
</style>
</head>
<body>

<div class="box left">Left</div>
<div class="box right">Right</div>

<div class="clear">Footer (cleared)</div>

</body>
</html>
