<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic_Content</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <main>
        <section class="list">
            <ul>
                <li>Apple</li>
                <li>Banana</li>
                <li>Mango</li>
            </ul>
            <label for="newItem">Add Item to list</label>
            <br>
            <input type="text" class="itemInput" placeholder="Enter Item name">
            <br>
           <div><button class="addItem">Add new Item</button></div>
        </section>
    </main>

    <script src="Script.js"></script>
</body>
</html>
